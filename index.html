<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="./blocks/style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Browser extensions manager UI</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <!-- 1. Header: logo + botão de tema -->
    <header class="header">
      <div class="header__right_side">
        <img
          class="header__logo"
          src="./assets/images/logo.svg"
          alt="Browser Extensions Manager"
        />
        <p>Extensions</p>
      </div>
      <button class="header__theme_button">
        <img
          class="header__theme_icon"
          src="./assets/images/icon-sun.svg"
          alt="Switch to light theme"
        />
      </button>
    </header>

    <!-- 2. Conteúdo principal -->
    <main>
      <!-- Título + filtros -->
      <section class="controls">
        <h1 class="controls__title">Extensions List</h1>
        <div class="controls__filters">
          <button class="filter-btn active">All</button>
          <button class="filter-btn">Active</button>
          <button class="filter-btn">Inactive</button>
        </div>
      </section>
      <!-- Grade de cards -->
      <template id="card-template">
        <article class="card">
          <div class="card__header">
            <img
              class="card__logo"
              src="./assets/images/logo-devlens.svg"
              alt="DevLens"
            />
            <div class="card__texts">
              <h2 class="card__title">DevLens</h2>
              <p class="card__description">
                Quickly inspect page layouts and visualize element boundaries.
              </p>
            </div>
          </div>
          <div class="card__buttons">
            <button class="card__remove">Remove</button>
            <label class="card__toggle">
              <input type="checkbox" checked />
              <span class="toggle__slider"></span>
            </label>
          </div>
        </article>
      </template>
      <section class="cards">
        <!-- Um card individual -->
      </section>
    </main>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </div>
    <script src="./scripts/scripts.js" defer></script>
  </body>
</html>
