<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="./blocks/style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Browser extensions manager UI</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .footer {
        font-size: 11px;
        text-align: center;
      }
      .footer a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <!-- 1. Header: logo + botão de tema -->
    <header class="header">
      <div class="header__right_side">
        <img
          class="header__logo"
          src="./assets/images/logo.svg"
          alt="Browser Extensions Manager"
        />
        <h1>Extensions</h1>
      </div>
      <button class="header__theme_button" type="button">
        <img
          class="header__theme_icon"
          src="./assets/images/icon-sun.svg"
          alt="Switch to light theme"
        />
      </button>
    </header>

    <!-- 2. Conteúdo principal -->
    <main>
      <div aria-live="polite" class="sr-only" id="announcer"></div>
      <!-- Título + filtros -->
      <section class="controls">
        <h2 class="controls__title">Extensions List</h2>
        <div class="controls__filters">
          <button class="filter-btn active" type="button" aria-pressed="true">
            All
          </button>
          <button class="filter-btn" type="button" aria-pressed="false">
            Active
          </button>
          <button class="filter-btn" type="button" aria-pressed="false">
            Inactive
          </button>
        </div>
      </section>
      <!-- Grade de cards -->
      <template id="card-template">
        <li class="card">
          <div class="card__header">
            <img
              class="card__logo"
              src="./assets/images/logo-devlens.svg"
              alt="DevLens"
            />
            <div class="card__texts">
              <h3 class="card__title">DevLens</h3>
              <p class="card__description">
                Quickly inspect page layouts and visualize element boundaries.
              </p>
            </div>
          </div>
          <div class="card__buttons">
            <button class="card__remove" type="button" aria-label="">
              Remove
            </button>
            <label class="card__toggle">
              <input type="checkbox" checked />
              <span class="toggle__slider"></span>
              <span class="sr-only">Toggle extension</span>
            </label>
          </div>
        </li>
      </template>
      <ul class="cards"></ul>
    </main>
    <div class="footer">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">NicolasSG</a>.
    </div>
    <script src="./scripts/scripts.js" defer></script>
  </body>
</html>
